name: Build FiLume (Windows)

# main = versões estáveis (Latest); dev = betas (pre-release, ex.: 1.4.0-beta.1).
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Renomeia tags antigas e mantém títulos/notas das releases iguais ao CHANGELOG.md.
  releases:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar releases com o CHANGELOG
        run: python3 tool/sync_releases.py sync

  windows:
    needs: releases
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Gerar e personalizar o runner do Windows
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name filume --org com.filume .
          if (Test-Path test/widget_test.dart) { Remove-Item test/widget_test.dart }
          dart run tool/patch_windows.dart

      - name: Compilar (release)
        run: flutter build windows --release

      - name: Embutir FFmpeg e runtime do Visual C++
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'build/windows/x64/runner/Release'
          $assets = gh release view latest -R BtbN/FFmpeg-Builds --json assets -q '.assets[].name'
          $pick = $assets |
            Where-Object { $_ -match '^ffmpeg-n\d+\.\d+-latest-win64-gpl-shared-\d+\.\d+\.zip$' } |
            Sort-Object { [version]($_ -replace '^ffmpeg-n(\d+\.\d+)-.*$', '$1') } |
            Select-Object -Last 1
          if (-not $pick) { $pick = 'ffmpeg-master-latest-win64-gpl-shared.zip' }
          Write-Host "FFmpeg: $pick"
          gh release download latest -R BtbN/FFmpeg-Builds -p $pick -O ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $bin = Get-ChildItem ffmpeg_dl -Recurse -Directory -Filter bin | Select-Object -First 1
          New-Item -ItemType Directory -Force "$release/ffmpeg" | Out-Null
          Copy-Item "$($bin.FullName)/*" "$release/ffmpeg" -Exclude ffplay.exe
          & "$release/ffmpeg/ffmpeg.exe" -hide_banner -version
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "C:/Windows/System32/$dll" $release
          }

      - name: Teste do núcleo com o FFmpeg embutido (não bloqueia o build)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:FILUME_FFMPEG_DIR = (Resolve-Path 'build/windows/x64/runner/Release/ffmpeg').Path
          New-Item -ItemType Directory -Force smoke | Out-Null
          & "$env:FILUME_FFMPEG_DIR/ffmpeg.exe" -v error -y -f lavfi -i testsrc2=s=640x360:r=30:d=40 -f lavfi -i sine=d=40 -c:v libx264 -g 60 -b:v 800k -c:a aac "smoke/teste 100%.mp4"
          dart run tool/core_test.dart "smoke/teste 100%.mp4" smoke/out
          $up = 'build/windows/x64/runner/Release/upscaler'
          if (Test-Path $up) { $env:FILUME_UPSCALER_DIR = (Resolve-Path $up).Path }
          dart run tool/image_test.dart smoke/img
          dart run tool/scan_test.dart
          dart run tool/ocr_test.dart
          dart run tool/signature_test.dart
          dart run tool/compress_test.dart
          dart run tool/compare_test.dart

      - name: Teste do editor de PDF com o PDFium (bloqueia o build)
        shell: pwsh
        run: |
          $env:FILUME_REQUIRE_PDFIUM = '1'
          dart run tool/editor_test.dart
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Empacotar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/FiLume | Out-Null
          Copy-Item build/windows/x64/runner/Release/* dist/FiLume -Recurse
          # FiLume PDF é o mesmo executável com outro nome; garante que ele está no pacote.
          if (-not (Test-Path 'dist/FiLume/FiLume PDF.exe')) { Copy-Item dist/FiLume/FiLume.exe 'dist/FiLume/FiLume PDF.exe' }
          Get-ChildItem dist/FiLume -Filter *.exe | ForEach-Object { "$($_.Name) $([math]::Round($_.Length/1KB)) KB" }
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md dist/FiLume
          Compress-Archive -Path dist/FiLume -DestinationPath FiLume-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FiLume-windows-x64
          path: FiLume-windows-x64.zip

      - name: Publicar em Releases (só quando a versão é nova)
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9A-Za-z.\-]+)').Matches[0].Groups[1].Value
          $beta = $version.Contains('-')
          $branch = '${{ github.ref_name }}'
          # Estável só sai do main; beta só sai do dev. O resto fica só como artefato do build.
          if ($branch -eq 'main' -and $beta) {
            Write-Host "$version é beta: no main só se publica versão estável. Nada a publicar."
            exit 0
          }
          if ($branch -ne 'main' -and -not $beta) {
            Write-Host "$version é estável: ela só é publicada pelo main. Nada a publicar."
            exit 0
          }
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "A release $tag já existe; nada a publicar."
            exit 0
          }
          python tool/sync_releases.py notes $version notes.md
          if ($beta) {
            gh release create $tag FiLume-windows-x64.zip --target $env:GITHUB_SHA --title "FiLume $version" --notes-file notes.md --prerelease --latest=false
          } else {
            gh release create $tag FiLume-windows-x64.zip --target $env:GITHUB_SHA --title "FiLume $version" --notes-file notes.md --latest
          }
