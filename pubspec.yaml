name: filume
description: "FiLume - compressor e divisor de vídeos rápido e leve."
publish_to: "none"
version: 1.4.0+6

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.0.3
  desktop_drop: ">=0.6.0 <0.9.0"
  path: ^1.9.0
  # Player das prévias (libmpv)
  media_kit: ^1.1.11
  media_kit_video: ">=1.2.5 <3.0.0"
  media_kit_libs_windows_video: ^1.0.10
  # Barra de título integrada (API clássica, anterior à reescrita 0.6)
  window_manager: ">=0.4.3 <0.6.0"

flutter:
  uses-material-design: true
